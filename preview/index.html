<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Suga Icons</title>
    <style>
      :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
      body { margin: 24px; }
      input { font: inherit; padding: 4px 8px; width: 240px; }
      main { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 16px; }
      figure { margin: 0; padding: 16px 8px; border: 1px solid #8884; border-radius: 8px; display: grid; justify-items: center; gap: 12px; }
      .sizes { display: flex; align-items: center; gap: 16px; }
      figcaption { font: 12px ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./preview.tsx"></script>
  </body>
</html>
